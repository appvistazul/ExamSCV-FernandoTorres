<!DOCTYPE html>
<html>
<head>
    <title>Suma y Resta de dos números</title>
    <style>
        .container {
            text-align: center;
            margin-top: 50px;
        }
        .content {
            display: inline-block;
            text-align: left;
        }
        .input-container {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .input-container label {
            width: 150px;
            margin-right: 10px;
        }
        .input-container input[type="text"] {
            width: 150px;
        }
        .boton-suma{
            background-color: green;
             border-radius: 15px;
        }
        .boton-resta{
            background-color: red;
            border-radius: 15px;
        }
         .boton-division{
            background-color: blue;
            border-radius: 15px;
        }
		
    </style>
</head>
<body>

<div class="container">
    <div class="content">
        <h2>Suma de dos números</h2>

        <form>
            <div class="input-container">
                <label for="num1">Primer número:</label>
                <input type="text" id="num1">
            </div>
            <div class="input-container">
                <label for="num2">Segundo número:</label>
                <input type="text" id="num2">
            </div>
            <input type="button" value="Calcular suma"  class="boton-suma" onclick="calcularSuma()">
        </form>

        <div id="resultado"></div>
    </div>
</div>

<div class="container">
    <div class="content">
        <h2>Resta de dos números</h2>

        <form>
            <div class="input-container">
                <label for="num1">Primer número:</label>
                <input type="text" id="num3">
            </div>
            <div class="input-container">
                <label for="num2">Segundo número:</label>
                <input type="text" id="num4">
            </div>
            <input type="button" value="Calcular resta" class="boton-resta" onclick="calcularResta()">
        </form>

        <div id="resultado-resta"></div>
    </div>
</div>

<div class="container">
    <div class="content">
        <h2>Division de dos números</h2>

        <form>
            <div class="input-container">
                <label for="num1">Primer número:</label>
                <input type="text" id="num5">
            </div>
            <div class="input-container">
                <label for="num2">Segundo número:</label>
                <input type="text" id="num6">
            </div>
            <input type="button" value="Calcular division" class="boton-division" onclick="calcularDivision()">
        </form>

        <div id="resultado-division"></div>
    </div>
</div>

<script>
function calcularSuma() {
    // Obtener los valores de los campos de entrada
    var num1 = parseFloat(document.getElementById("num1").value);
    var num2 = parseFloat(document.getElementById("num2").value);

    // Verificar si ambos valores son números
    if (!isNaN(num1) && !isNaN(num2)) {
        // Calcular la suma
        var suma = num1 + num2;

        // Mostrar el resultado en el elemento con id "resultado"
        document.getElementById("resultado").innerHTML = "El resultado de la suma es: " + suma;
    } else {
        // Mostrar un mensaje de error si los valores no son números
        document.getElementById("resultado").innerHTML = "Por favor, ingrese dos números válidos.";
    }
}

function calcularResta() {
    // Obtener los valores de los campos de entrada
    var num1 = parseFloat(document.getElementById("num3").value);
    var num2 = parseFloat(document.getElementById("num4").value);

    // Verificar si ambos valores son números
    if (!isNaN(num1) && !isNaN(num2)) {
        // Calcular la resta
        var resta = num1 - num2;

        // Mostrar el resultado en el elemento con id "resultado"
        document.getElementById("resultado-resta").innerHTML = "El resultado de la resta es: " + resta;
    } else {
        // Mostrar un mensaje de error si los valores no son números
        document.getElementById("resultado-resta").innerHTML = "Por favor, ingrese dos números válidos.";
    }
}

function calcularDivision() {
    // Obtener los valores de los campos de entrada
    var num1 = parseFloat(document.getElementById("num5").value);
    var num2 = parseFloat(document.getElementById("num6").value);

    // Verificar si ambos valores son números
    if (!isNaN(num1) && !isNaN(num2)) {
        // Calcular la resta
        var division = num1 / num2;

        // Mostrar el resultado en el elemento con id "resultado"
        document.getElementById("resultado-division").innerHTML = "El resultado de la division es: " + division;
    } else {
        // Mostrar un mensaje de error si los valores no son números
        document.getElementById("resultado-division").innerHTML = "Por favor, ingrese dos números válidos.";
    }
}


</script>

</body>
</html>
